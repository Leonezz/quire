[package]
name = "quire-desktop"
version = "0.2.0-alpha.1"
description = "Quire — a quiet place to read everything you subscribe to"
authors = ["Leonezz"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "quire_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
aes-gcm = "0.10"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
security-framework = "3"
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(all(target_os = "macos", not(target_arch = "aarch64")))'.dependencies]
security-framework = "3"
whisper-rs = { version = "0.16" }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.release.build-override]
strip = false
opt-level = 0
