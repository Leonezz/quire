name: Release

# Cutting a Tauri 2 release: bump apps/desktop/package.json, apps/desktop/src-tauri/Cargo.toml,
# and apps/desktop/src-tauri/tauri.conf.json `version`, commit, tag `v<version>`, and push the tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.2.0-tauri.1)"
        required: true
      runner:
        description: "macOS runner label (e.g. macos-latest, macos-15-intel, macos-26-intel)"
        required: false
        default: "macos-latest"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RELEASE_REPO: ${{ github.repository }}

jobs:
  mac:
    name: macOS Tauri 2 (arm64 + x64)
    runs-on: ${{ github.event.inputs.runner || 'macos-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "${{ inputs.tag }}" != "v$version" ]; then
            echo "::error::Tag ${{ inputs.tag }} does not match apps/desktop/package.json version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Apple code signing & notarization
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_SECRET" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_SECRET"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID_SECRET" ]; then
            {
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
            } >> "$GITHUB_ENV"
          fi

      - name: Build arm64 and x64 DMG bundles
        shell: bash
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          mkdir -p apps/desktop/release
          pnpm --filter @read/desktop exec tauri build --target aarch64-apple-darwin --bundles app,dmg
          cp "apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Quire_${version}_aarch64.dmg" "apps/desktop/release/Quire-${version}-arm64.dmg"
          pnpm --filter @read/desktop exec tauri build --target x86_64-apple-darwin --bundles app,dmg
          cp "apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/Quire_${version}_x64.dmg" "apps/desktop/release/Quire-${version}-x64.dmg"

      - name: Publish GitHub Release
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if ! gh release view "$tag" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$RELEASE_REPO" --title "Quire $tag" --notes "Building…" --prerelease
          fi
          gh release upload "$tag" apps/desktop/release/*.dmg --repo "$RELEASE_REPO" --clobber
